name: Compile GCC (Windows)
on:
  push:
    tags: '*'
    branches: [master]
    paths-ignore:
      - README.md
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - 2.7.2-psx
          - 2.7.2-cdk
          - 2.8.1-psx
    name: Build GCC ${{ matrix.version }} (Windows)
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Build GCC
        run: VERSION=${{ matrix.version }} PLATFORM=windows make
      - name: Create release archive
        shell: bash
        run: |
          cd build-gcc-${{ matrix.version }}-windows
          zip ../gcc-${{ matrix.version }}-windows.zip *
      - name: Create artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc-${{ matrix.version }}-windows
          path: gcc-${{ matrix.version }}-windows.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            gcc-${{ matrix.version }}-windows.zip
